# PersDocBench content register profile v1.0-draft
#
# Machine-readable twin of docs/dataset/content_register_spec_v1.md
# Gate-3 INPUT. Nothing here authorises generation; it constrains it.
#
# Design: `domain` (document genre, approved Gate 2 / D2) is ORTHOGONAL to
# `subject_field` (what the text is about, new D13) and to `register` (how expert
# the prose is, new D14). A medical paper, a medical manual and a medical textbook
# share a subject_field but differ in genre and register.

version: "1.0-draft"
status: draft
approved: false

# ---------------------------------------------------------------------------
# Axis 2: subject_field — shares sum to 1.0
# ---------------------------------------------------------------------------
