  report: artifacts/fonts/local_fonts.json        # git-ignored
  scanned_on: "2026-11-18"
  host_font_files: 705
  persian_capable_names: 21          # fontconfig family names, weights included
  persian_capable_families: 12       # weights collapsed to families
  in_verified_inventory: 6           # Vazirmatn, Sahel, Amiri, Noto Naskh/Sans/Nastaliq
  pending_licence_present_locally: [IRANSansX]
  free_but_not_yet_checked_in: [DejaVu Sans, Noto Kufi Arabic, Vazir]
  note: >-
    705 installed font files yield 12 Persian-capable families and only 6 that are both
    Persian-capable and already in the verified inventory. The local machine is a
    convenience, not the font strategy: the inventory above is the plan.
