# PersDocBench font inventory v1.0-draft
# Answers D3/D30: the user requires ~30 Persian families, NOT one or two, plus
# handwriting-style families and "other" styles (display, Nastaliq, monospace).
# Machine-readable twin of docs/dataset/benchmark_spec_v1.md §5.4.
# Status: DRAFT — every licence below was checked on 2026-11-18, no licence is guessed.

schema_version: "1.0"
status: draft
approved: false
decision_refs: [D3, D30, D31]
verified_on: "2026-11-18"
verification_method: >-
  GitHub REST `GET /repos/{owner}/{repo}/license` (spdx_id + licence-file sha), or
  `GET /repos/google/fonts/contents/ofl/{family}/OFL.txt` for Google Fonts families.
  Where GitHub reported NOASSERTION the licence text was fetched and matched against
  "SIL OPEN FONT LICENSE Version 1.1". No entry is marked verified on filename or reputation.

policy:
  target_families: 30                 # D30: user requires ~30 Persian families
  weights_min_families: 4             # regular / medium / bold / light at minimum
  handwriting_like_min_families: 4    # D30: font-based handwriting styles
  nastaliq_page_share_cap: 0.08       # approved with D3/T3 (unchanged)
  allowed_licences: [OFL-1.1, Apache-2.0, MIT, Public-Domain, Bitstream-Vera]
  review_before_use: [GPL-3.0]        # usable for rendering, flagged: font files not redistributed
  excluded_licences: [proprietary, unverified]
  redistribute_font_files: false      # font binaries never ship with the dataset
  output_images_carry_font_licence: false
  output_images_note: >-
    Rendering text with a font produces a document, not a derivative of the font
    software; the OFL's copyright notice and attribution obligations attach to the
    font files, which we do not redistribute. We nonetheless name every family used
    in the data card and ship the licence texts in docs/, because the claim is worth
    being checkable even where it is not legally owed.
  attribution_in_data_card: true
  per_family_usage_log: true          # each rendered page records family_id + weight

# Families whose EULA we could not verify. Rendering with them is the risk:
# the page image is the dataset artefact, so an unverifiable EULA is treated as
# a redistribution risk, not as a free option. Real documents that happen to use
# them may still enter the real-data track — the font is the document's, not ours.
pending_licence_verification:
  - name: IRANSansX
    presence: "installed locally (IRANSansX-Regular.ttf), UKWN foundry, no licence field"
    status: excluded_pending_licence
    note: >-
      The most common Persian UI font in real documents. No authoritative licence
      file found (only unaffiliated re-uploads). Obtain the licence or cover this
      style through the real-document track instead of rendering.
  - name: B Nazanin / B Zar
    status: excluded_proprietary
    note: most common Persian body fonts in official print; proprietary, excluded.
  - name: Yekan Bakh / IRANYekan
    status: excluded_proprietary
  - name: Dana / Shabnam Pro / Vazir Pro
    status: excluded_proprietary

